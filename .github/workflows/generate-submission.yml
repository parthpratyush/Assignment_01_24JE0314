name: Generate assignment outputs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate numerical figures
        run: python generate_figures.py

      - name: Build PDF report
        run: python build_report.py

      - name: Commit generated submission outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures results.csv REPORT.pdf
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate report and assignment figures [skip ci]"
            git push
          fi
